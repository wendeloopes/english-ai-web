name: Deploy English Ai PWA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'icon-*.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site files and self-host LiteRT-LM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html sw.js manifest.json icon-*.png _site/
          python -m json.tool _site/manifest.json >/dev/null
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/icon-192.png
          test -f _site/icon-512.png

          # Pin a known-compatible LiteRT-LM version; do not use npm's moving latest tag.
          npm install --prefix .build --no-save --no-audit --no-fund @litert-lm/core@0.18.0 esbuild
          PKG=".build/node_modules/@litert-lm/core"
          VENDOR="_site/vendor/litert-lm/0.18.0"
          test -s "$PKG/dist/index.js"
          test -d "$PKG/wasm"
          mkdir -p "$VENDOR/wasm"
          .build/node_modules/.bin/esbuild "$PKG/dist/index.js" --bundle --format=esm --platform=browser --target=es2022 --outfile="$VENDOR/litert-lm.js"
          cp -R "$PKG/wasm/." "$VENDOR/wasm/"
          if [ -f "$PKG/LICENSE" ]; then cp "$PKG/LICENSE" "$VENDOR/LICENSE"; else curl -fsSL --retry 3 "https://www.apache.org/licenses/LICENSE-2.0.txt" -o "$VENDOR/LICENSE-2.0.txt"; fi
          test -s "$VENDOR/litert-lm.js"
          find "$VENDOR/wasm" -type f -size +0c | grep -q .
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("_site")
          vendor = root / "vendor/litert-lm/0.18.0"
          files = [
              p.relative_to(root).as_posix()
              for p in sorted(vendor.rglob("*"))
              if p.is_file() and p.name != "assets.json"
          ]
          if not any(p.endswith(".wasm") for p in files):
              raise SystemExit("LiteRT-LM WASM files are missing")
          (vendor / "assets.json").write_text(json.dumps(files, separators=(",", ":")))
          print(f"Prepared {len(files)} LiteRT-LM runtime files for offline caching")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
