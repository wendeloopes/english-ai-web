name: Build English Ai native Android
on:
  workflow_dispatch:
  push:
    branches: [native-android-offline]
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-maskable-512.png'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare approved UI assets
        run: |
          mkdir -p android-native/app/src/main/assets/www
          cp icon-192.png icon-512.png icon-maskable-512.png android-native/app/src/main/assets/www/
          mkdir -p android-native/app/src/main/res/drawable-nodpi
          cp icon-512.png android-native/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Compile debug APK
        working-directory: android-native
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: English-Ai-Native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
