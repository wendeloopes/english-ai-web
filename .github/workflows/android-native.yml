name: Build English Ai native Android
on:
  workflow_dispatch:
  push:
    branches: [native-android-offline]
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-maskable-512.png'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare approved UI assets
        run: |
          mkdir -p android-native/app/src/main/assets/www
          cp index.html icon-192.png icon-512.png icon-maskable-512.png android-native/app/src/main/assets/www/
      - name: Compile debug APK
        working-directory: android-native
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: English-Ai-Native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
