name: Build English Ai native Android
on:
  workflow_dispatch:
  push:
    branches: [native-android-offline, native-android-1.3-claude-fixes, native-android-1.3.4-subtitle-smoothness, repair/english-ai-v1.3.4-audio-history, design/navy-bottom-navigation-v1.3.4]
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'manifest.json'
      - 'tools/**'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-maskable-512.png'
      - '.github/workflows/android-native.yml'
concurrency:
  group: native-android-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare approved UI assets
        run: |
          mkdir -p android-native/app/src/main/assets/www
          cp icon-192.png icon-512.png icon-maskable-512.png android-native/app/src/main/assets/www/
          cp manifest.json android-native/app/src/main/assets/www/manifest.json
          mkdir -p android-native/app/src/main/res/drawable-nodpi
          cp icon-512.png android-native/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Guard - fixes present
        run: |
          if grep -rnE "estimated minimum|requiredHeadroom|availMem" android-native/app/src; then echo "OLD memory check still present"; exit 1; fi
          grep -q "maxNumTokens" android-native/app/src/main/java/com/englishai/app/LiteRtEngine.kt
          grep -q "getInfo" android-native/app/src/main/java/com/englishai/app/NativeBridge.kt
          grep -q "getLastCrash" android-native/app/src/main/java/com/englishai/app/NativeBridge.kt
          grep -q "extLevel" android-native/app/src/main/assets/www/index.html
      - name: Static checks (tools/static_check.py)
        run: python3 tools/static_check.py
      - name: Compile debug APK
        working-directory: android-native
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log
      - name: Verify the APK really has version 1.3.4 / code 7
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging android-native/app/build/outputs/apk/debug/app-debug.apk | head -1 | tee apk-version.txt
          grep -q "versionCode='7' versionName='1.3.4'" apk-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            apk-version.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: English-Ai-Native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package editable source for external review
        run: |
          zip -r English-Ai-Source-Claude.zip . -x ".git/*" "android-native/app/build/*" ".gradle/*"
      - uses: actions/upload-artifact@v4
        with:
          name: English-Ai-Source-Claude
          path: English-Ai-Source-Claude.zip
          if-no-files-found: error
