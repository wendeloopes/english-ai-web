name: Build English Ai native Android
on:
  workflow_dispatch:
  push:
    branches: [native-android-offline]
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-maskable-512.png'
      - '.github/workflows/android-native.yml'
concurrency:
  group: native-android-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare approved UI assets
        run: |
          mkdir -p android-native/app/src/main/assets/www
          cp icon-192.png icon-512.png icon-maskable-512.png android-native/app/src/main/assets/www/
          mkdir -p android-native/app/src/main/res/drawable-nodpi
          cp icon-512.png android-native/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Verify native integration contract
        run: |
          HTML=android-native/app/src/main/assets/www/index.html
          BRIDGE=android-native/app/src/main/java/com/englishai/app/NativeBridge.kt
          ENGINE=android-native/app/src/main/java/com/englishai/app/LiteRtEngine.kt
          grep -q 'chat:curId,count:msgs.length' "$HTML"
          grep -q 'engine.generate(root.optString("chat"), root.optInt("count"' "$BRIDGE"
          grep -q 'engine.load(modelFile.absolutePath, totalRam())' "$BRIDGE"
          grep -q 'fun load(path: String, totalRamBytes: Long)' "$ENGINE"
          grep -q 'maxNumTokens = tokens' "$ENGINE"
          grep -q 'trimConversation()' "$ENGINE"
          if grep -rnE 'estimated minimum|requiredHeadroom|availMem' android-native/app/src; then
            echo 'Obsolete free-RAM guard detected; review the memory strategy.'
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('android-native/app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', html, re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline application script, found {len(scripts)}')
          Path('/tmp/english-ai-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/english-ai-inline.js

      - name: Compile debug APK
        working-directory: android-native
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: English-Ai-Native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package editable source for external review
        run: |
          zip -r English-Ai-Source-Claude.zip . -x ".git/*" "android-native/app/build/*" "android-native/build/*" "android-native/.gradle/*" "android-twa/app/build/*" "android-twa/build/*" "android-twa/.gradle/*" ".gradle/*" "English-Ai-Source-Claude.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: English-Ai-Source-Claude
          path: English-Ai-Source-Claude.zip
          if-no-files-found: error
